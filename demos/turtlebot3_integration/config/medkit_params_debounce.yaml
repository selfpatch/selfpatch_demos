# ros2_medkit gateway configuration for TurtleBot3 demo
# ARTICLE 3 - DEBOUNCE VERSION
# Differences from the default profile in medkit_params.yaml:
#   confirmation_threshold: -3, so three sustained FAILED events are needed
#     before an operator sees the fault, instead of the default -1
#   healing_enabled: true, so a fault clears itself once the condition is gone
#
# Node runs under /diagnostics namespace, so we need to match that here
diagnostics:
  ros2_medkit_gateway:
    ros__parameters:
      server:
        # Bind to all interfaces for Docker networking
        host: "0.0.0.0"
        port: 8080

      refresh_interval_ms: 10000  # 10 seconds (default), reduces log spam

      cors:
        allowed_origins: ["*"]
        allowed_methods: ["GET", "PUT", "POST", "DELETE", "OPTIONS"]
        allowed_headers: ["Content-Type", "Accept"]
        allow_credentials: false
        max_age_seconds: 86400

      # Discovery configuration
      discovery:
        mode: "hybrid"  # runtime_only, manifest_only, or hybrid
        manifest_path: ""  # Will be set via launch argument
        manifest_strict_validation: true
        runtime:
          create_synthetic_components: false  # Manifest defines components

# Fault Manager configuration (runs in root namespace)
fault_manager:
  ros__parameters:
    # Storage configuration
    storage_type: "sqlite"
    database_path: "/var/lib/ros2_medkit/faults.db"

    # === DEBOUNCE CONFIGURATION (Article 3) ===
    # -3 filters the no-progress reporter, which repeats every 5 s while the
    # robot is stuck: three reports, so roughly 15 s of it, before an operator
    # sees anything. That is the contrast with the storm profile.
    confirmation_threshold: -3
    healing_enabled: true
    # A confirmed fault sits at the confirmation threshold, because the counter is
    # clamped to the band, so healing costs healing_threshold minus -3 PASSED
    # events: three at 0, six at 3. The detector answers a recovery with a burst
    # of three, which is what makes 0 the value that heals and 3 the value that
    # would not.
    healing_threshold: 0
    auto_confirm_after_sec: 0.0  # Disabled

    # The goal-status faults fire once per status change, so the -3 above would
    # hide them permanently. They report under their own source and take their
    # own thresholds from here.
    entity_thresholds:
      config_file: "/root/demo_ws/src/turtlebot3_medkit_demo/config/entity_thresholds.yaml"

    # Snapshot configuration (freeze frames)
    snapshots:
      enabled: true
      background_capture: true  # Non-blocking capture
      timeout_sec: 2.0
      max_message_size: 131072  # 128KB max per message

      # Topics to capture for all faults
      default_topics:
        - /odom
        - /amcl_pose
        - /scan
        - /tf
        - /navigate_to_pose/_action/status

      # Rosbag recording configuration
      rosbag:
        enabled: true
        duration_sec: 10.0  # Record 10 seconds before fault confirmation
        duration_after_sec: 2.0  # Record 2 seconds after confirmation
        lazy_start: false  # Always recording (ring buffer)
        format: "mcap"  # MCAP format (recommended for cross-platform)
        storage_path: "/var/lib/ros2_medkit/rosbags"
        max_bag_size_mb: 100  # Max size per rosbag file
        max_total_storage_mb: 1000  # 1GB total storage limit
        auto_cleanup: true  # Cleanup rosbags on fault clear

        # Topics to record (use 'config' or 'all')
        topics: "config"  # Use include/exclude lists below
        include_topics:
          - /odom
          - /amcl_pose
          - /scan
          - /cmd_vel
          - /tf
          - /tf_static
          - /navigate_to_pose/_action/status
          - /navigate_to_pose/_action/feedback
          - /local_costmap/costmap
          - /global_costmap/costmap
          - /plan
          - /diagnostics
        exclude_topics:
          - /rosout
          - /parameter_events
