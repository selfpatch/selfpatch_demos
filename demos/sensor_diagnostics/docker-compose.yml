services:
  # Main demo service - runs all sensor nodes + gateway
  sensor-demo:
    build:
      context: .
      dockerfile: Dockerfile
    # Names, ports and the ROS domain can be overridden to run more than one
    # robot side by side, see "Several robots" in the README.
    container_name: ${DEMO_CONTAINER:-sensor_diagnostics_demo}
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-40}
      - BEACON_MODE=${BEACON_MODE:-none}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    stdin_open: true
    tty: true
    # Default command launches the full demo
    # Override with: docker compose run sensor-demo bash
    command: >
      bash -c "mkdir -p /var/lib/ros2_medkit/rosbags &&
               source /opt/ros/jazzy/setup.bash &&
               source /root/demo_ws/install/setup.bash &&
               ros2 launch sensor_diagnostics_demo demo.launch.py"

  # Web UI for visualization (optional)
  medkit-web-ui:
    image: ghcr.io/selfpatch/ros2_medkit_web_ui:latest
    container_name: ${WEB_UI_CONTAINER:-ros2_medkit_web_ui}
    ports:
      - "${WEB_UI_PORT:-3000}:80"
    depends_on:
      - sensor-demo

  # For CI testing - headless mode, tests run externally
  sensor-demo-ci:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensor_diagnostics_demo_ci
    environment:
      - ROS_DOMAIN_ID=40
      - BEACON_MODE=none
    ports:
      - "8080:8080"
    command: >
      bash -c "mkdir -p /var/lib/ros2_medkit/rosbags &&
               source /opt/ros/jazzy/setup.bash &&
               source /root/demo_ws/install/setup.bash &&
               ros2 launch sensor_diagnostics_demo demo.launch.py"
